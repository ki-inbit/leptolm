[workspace]
resolver = "2"
members = ["shared", "frontend", "backend", "leptolm-core"] # 👑 leptolm-core を追加

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
leptos = { version = "0.7" }

[[workspace.metadata.leptos]]
name = "leptolm"
bin-package = "backend"
lib-package = "frontend"
site-root = "target/site"
site-pkg-dir = "pkg"
site-addr = "0.0.0.0:3000"
reload-port = 3001
#env = "DEV"
bin-features = ["ssr"]
lib-features = ["hydrate"]