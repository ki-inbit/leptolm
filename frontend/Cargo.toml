[package]
name = "frontend"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
shared = { path = "../shared" }
leptos = { workspace = true }
leptos_meta = { version = "0.7" }
leptos-mview = { version = "0.3" }
reactive_stores = { version = "0.1" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1.0"
log = "0.4"
reqwest = { version = "0.12", features = ["json"] } # 👑 これを追記！
web-sys = { version = "0.3", features = ["Window", "Location"] }
leptolm-core = { path = "../leptolm-core" }
serde_json.workspace = true
rmp-serde = "1.3.1"
js-sys = "0.3"

[features]
hydrate = ["leptos/hydrate"]
ssr = ["leptos/ssr", "leptos_meta/ssr"]
cloudflare = []