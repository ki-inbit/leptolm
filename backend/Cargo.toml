[package]
# 👑 アンダースコア(_)は絶対NG！ハイフン(-)にしてください
name = "backend" 
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.35.0"
wit-bindgen-rt = "0.35.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

leptos = { version = "0.7", features = ["ssr"] }
frontend = { path = "../frontend" }
shared = { path = "../shared" }

# 👑 最新のcargo-componentに合わせた1行記法！
[package.metadata.component]
target = "wasi:http/proxy@0.2.3"
